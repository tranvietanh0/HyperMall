server:
  port: ${AI_SERVICE_PORT:8092}

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

app:
  jwt:
    secret: ${JWT_SECRET}
  ai:
    enabled: ${AI_CHAT_ENABLED:true}
    provider:
      enabled: ${AI_PROVIDER_ENABLED:true}
      base-url: ${AI_PROVIDER_BASE_URL:http://localhost:8317}
      api-key: ${AI_PROVIDER_API_KEY:}
      model: ${AI_PROVIDER_MODEL:gpt-4o-mini}
      timeout-ms: ${AI_PROVIDER_TIMEOUT_MS:15000}
    fallback-provider:
      enabled: ${AI_FALLBACK_PROVIDER_ENABLED:true}
      base-url: ${AI_FALLBACK_PROVIDER_BASE_URL:https://api.deepseek.com}
      api-key: ${AI_FALLBACK_PROVIDER_API_KEY:}
      model: ${AI_FALLBACK_PROVIDER_MODEL:deepseek-chat}
      timeout-ms: ${AI_FALLBACK_PROVIDER_TIMEOUT_MS:15000}
    chat:
      max-message-chars: ${AI_CHAT_MAX_MESSAGE_CHARS:2000}
      max-history-messages: ${AI_CHAT_MAX_HISTORY_MESSAGES:6}
      product-suggestion-limit: ${AI_CHAT_PRODUCT_SUGGESTION_LIMIT:3}
    product:
      service-base-url: ${AI_PRODUCT_SERVICE_BASE_URL:http://localhost:8082}
